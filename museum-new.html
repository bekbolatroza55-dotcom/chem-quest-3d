
<script>
/* CHEM QUEST 3D — ҒАЖАЙЫП ХИМИЯ ӘЛЕМІ */
(function () {
  const TAU = Math.PI * 2;
  const palette = [
    {wall:"#092d61",floor:"#071b39",light:"#47e8ff",second:"#9b7aff"},
    {wall:"#073e38",floor:"#082a28",light:"#4bffba",second:"#e6ff78"},
    {wall:"#371454",floor:"#200e38",light:"#ffcf62",second:"#dc78ff"}
  ];

  function line(x1,y1,x2,y2,color,width=2) {
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.strokeStyle=color;
    ctx.lineWidth=width;
    ctx.stroke();
  }

  function circle(x,y,r,color,glow=0) {
    ctx.save();
    ctx.shadowColor=color;
    ctx.shadowBlur=glow;
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.arc(x,y,Math.max(0.1,r),0,TAU);
    ctx.fill();
    ctx.restore();
  }

  function polygon(points,color) {
    if(points.some(p=>!p))return;
    ctx.beginPath();
    ctx.moveTo(points[0].x,points[0].y);
    for(let i=1;i<points.length;i++)
      ctx.lineTo(points[i].x,points[i].y);
    ctx.closePath();
    ctx.fillStyle=color;
    ctx.fill();
  }

  function pLine(a,b,color,width=2) {
    if(a&&b)line(a.x,a.y,b.x,b.y,color,width);
  }

  function glowText(text,x,y,size,color) {
    ctx.save();
    ctx.textAlign="center";
    ctx.font="bold "+Math.max(10,size)+"px Arial";
    ctx.shadowColor=color;
    ctx.shadowBlur=18;
    ctx.fillStyle=color;
    ctx.fillText(text,x,y);
    ctx.restore();
  }

  function atom(x,y,s,time,color) {
    ctx.save();
    ctx.translate(x,y);
    ctx.strokeStyle=color;
    ctx.lineWidth=Math.max(1.5,s*.035);
    ctx.shadowColor=color;
    ctx.shadowBlur=16;
    for(let k=0;k<3;k++) {
      ctx.save();
      ctx.rotate(k*Math.PI/3+time*.13);
      ctx.scale(1,.36);
      ctx.beginPath();
      ctx.arc(0,0,s,0,TAU);
      ctx.stroke();
      ctx.restore();
    }
    circle(0,0,s*.20,"#fff1ac",16);
    for(let k=0;k<3;k++) {
      let a=time*(.6+k*.16)+k*TAU/3;
      let xx=Math.cos(a)*s;
      let yy=Math.sin(a)*s*.36;
      let rot=k*Math.PI/3+time*.13;
      let ex=xx*Math.cos(rot)-yy*Math.sin(rot);
      let ey=xx*Math.sin(rot)+yy*Math.cos(rot);
      circle(ex,ey,s*.085,"#ffffff",9);
    }
    ctx.restore();
  }

  function flask(x,y,s,time,color) {
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(s,s);
    ctx.shadowColor=color;
    ctx.shadowBlur=12;
    ctx.fillStyle="#c4ffff18";
    ctx.strokeStyle="#c9faff";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(-8,-36);
    ctx.lineTo(8,-36);
    ctx.lineTo(8,-12);
    ctx.lineTo(26,22);
    ctx.quadraticCurveTo(30,35,15,36);
    ctx.lineTo(-15,36);
    ctx.quadraticCurveTo(-30,35,-26,22);
    ctx.lineTo(-8,-12);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle=color;
    ctx.globalAlpha=.65;
    ctx.beginPath();
    ctx.moveTo(-21,16);
    ctx.quadraticCurveTo(0,11+Math.sin(time*2)*3,21,16);
    ctx.lineTo(25,28);
    ctx.quadraticCurveTo(23,33,13,33);
    ctx.lineTo(-13,33);
    ctx.quadraticCurveTo(-23,33,-25,28);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha=1;

    for(let i=0;i<5;i++){
      let yy=25-((time*15+i*12)%55);
      let xx=Math.sin(i*3+time)*11;
      circle(xx,yy,2+i%2,"#dfffff",4);
    }
    ctx.restore();
  }

  function molecule(x,y,s,time,color) {
    const nodes=[
      [-.8,0,0],[-.25,-.65,1],[.55,-.35,2],
      [.9,.45,3],[0,.8,4],[-.1,.05,5]
    ];
    const edges=[[0,1],[1,2],[2,3],[3,4],[4,0],[1,5],[5,3]];
    let pos=nodes.map(n=>{
      let a=time*.24;
      let xx=n[0]*Math.cos(a)-n[1]*Math.sin(a);
      let yy=n[0]*Math.sin(a)+n[1]*Math.cos(a);
      return [x+xx*s,y+yy*s];
    });
    for(const [a,b] of edges)
      line(pos[a][0],pos[a][1],pos[b][0],pos[b][1],
        "#b9b3ff",Math.max(2,s*.09));
    pos.forEach((p,i)=>{
      let c=i%3===0?"#ff7799":i%3===1?color:"#9eeaff";
      circle(p[0],p[1],s*(i===5?.23:.18),c,16);
      circle(p[0]-s*.04,p[1]-s*.05,s*.05,"#ffffff",3);
    });
  }

  function displayExhibit(o,time,t) {
    let p=project(o.x,1.25,o.z);
    if(!p)return;
    let s=Math.min(p.s,canvas.height*.85);
    if(s<2)return;

    let complete=done[room].has(o.i);
    let base=project(o.x,0,o.z);

    if(base) {
      ctx.save();
      ctx.shadowColor=t.light;
      ctx.shadowBlur=15;
      ctx.fillStyle="#071524";
      ctx.beginPath();
      ctx.ellipse(base.x,base.y,s*.75,s*.22,0,0,TAU);
      ctx.fill();
      ctx.strokeStyle=complete?"#60cfa3":t.light;
      ctx.lineWidth=Math.max(1,s*.045);
      ctx.stroke();
      ctx.restore();
    }

    ctx.fillStyle="#10253b";
    ctx.fillRect(p.x-s*.57,p.y+s*.31,s*1.14,s*.39);
    ctx.fillStyle=complete?"#6ecda5":t.light;
    ctx.fillRect(p.x-s*.55,p.y+s*.29,s*1.10,s*.055);

    let size=Math.max(8,Math.min(s*.42,canvas.height*.26));
    if(room===0)atom(p.x,p.y-s*.1,size,time+o.i,t.light);
    if(room===1)flask(p.x,p.y-s*.05,
      Math.max(.15,Math.min(s/90,5)),time+o.i*.3,
      o.i%2?t.second:t.light);
    if(room===2)molecule(p.x,p.y-s*.1,size,time+o.i,t.light);

    glowText(complete?"✓":String(o.i+1),
      p.x,p.y+s*.59,Math.min(32,Math.max(11,s*.20)),
      complete?"#92ffd0":"#ffffff");
  }

  function architecture(t,time) {
    const W=canvas.width,H=canvas.height;
    const bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,"#020915");
    bg.addColorStop(.53,t.wall);
    bg.addColorStop(1,t.floor);
    ctx.fillStyle=bg;
    ctx.fillRect(0,0,W,H);

    // Жұлдыздар мен ауадағы жарық бөлшектері
    for(let i=0;i<65;i++){
      let x=((i*7919+1234)%997)/997*W;
      let y=((i*3571+567)%991)/991*H*.72;
      let r=(i%3+1)*devicePixelRatio*.7;
      circle(x+Math.sin(time*.3+i)*3,y+Math.cos(time*.5+i)*4,
        r,i%2?t.light:"#ffffff",4);
    }

    // Еденнің перспективалық торы
    for(let x=-4;x<=4;x+=1){
      pLine(project(x,-.05,3),project(x,-.05,-26),
        "#58ddff55",Math.max(1,W*.0013));
    }
    for(let z=3;z>=-26;z-=2){
      pLine(project(-4,-.05,z),project(4,-.05,z),
        "#a7faff33",Math.max(1,W*.001));
    }

    // Қабырғалар, жарық жолақтары, төбе
    for(let z=3;z>=-25;z-=3){
      for(const x of [-4.3,4.3]){
        pLine(project(x,0,z),project(x,3.4,z),
          t.light,Math.max(1,W*.003));
        pLine(project(x,3.4,z),project(x,3.4,z-2.7),
          t.second,Math.max(1,W*.002));
      }
      pLine(project(-4.3,3.4,z),project(4.3,3.4,z),
        t.light+"77",Math.max(1,W*.002));
    }

    // Екі жақтағы қабырғадағы сәндік панельдер
    for(let z=1;z>=-24;z-=5){
      for(const x of [-4.15,4.15]){
        let a=project(x,1.9,z);
        if(!a)continue;
        circle(a.x,a.y,Math.min(a.s*.19,35),t.second,18);
        glowText(room===0?"⚛":room===1?"⚗":"✦",
          a.x,a.y+5,Math.min(28,a.s*.26),t.light);
      }
    }
  }

  function door(t,time) {
    const p=project(0,1.5,-25.1);
    if(!p)return;
    const s=p.s;
    const open=done[room].size===10;
    const color=open?"#4bffbf":"#ff668f";

    ctx.save();
    ctx.shadowColor=color;
    ctx.shadowBlur=24;
    ctx.fillStyle="#08121f";
    ctx.fillRect(p.x-s*.9,p.y-s*1.45,s*1.8,s*2.9);
    ctx.strokeStyle=color;
    ctx.lineWidth=Math.max(2,s*.13);
    ctx.strokeRect(p.x-s*.9,p.y-s*1.45,s*1.8,s*2.9);
    ctx.restore();

    if(open) {
      const g=ctx.createRadialGradient(p.x,p.y,1,p.x,p.y,s*1.2);
      g.addColorStop(0,"#caffed");
      g.addColorStop(.35,"#43eab8");
      g.addColorStop(1,"#084d52");
      ctx.fillStyle=g;
      ctx.fillRect(p.x-s*.75,p.y-s*1.30,s*1.5,s*2.6);
    }
    glowText(open?(room===2?"МӘРЕ":"КЕЛЕСІ ЗАЛ"):"🔒",
      p.x,p.y,Math.max(11,s*.26),open?"#ffffff":"#ffb5c9");
  }

  // Бұрынғы draw() функциясының орнына жаңа 3D көрініс
  draw=function(){
    const t=palette[room];
    const time=performance.now()/1000;
    const W=canvas.width,H=canvas.height;

    architecture(t,time);

    // Залдың ортасында ілінген алып химиялық модель
    let centerpiece=project(0,2.7,-12);
    if(centerpiece){
      let s=Math.min(centerpiece.s*.6,H*.17);
      if(room===0)atom(centerpiece.x,centerpiece.y,
        s,time*.5,t.second);
      if(room===1)flask(centerpiece.x,centerpiece.y,
        Math.min(2,s/42),time,t.second);
      if(room===2)molecule(centerpiece.x,centerpiece.y,
        s,time*.6,t.second);
    }

    // 10 интерактивті экспонат
    let sorted=objects.map(o=>({
      o,p:project(o.x,1.25,o.z)
    })).filter(v=>v.p).sort((a,b)=>b.p.depth-a.p.depth);

    sorted.forEach(v=>displayExhibit(v.o,time,t));
    door(t,time);

    // Зал атауы
    glowText(
      ["⚛ АТОМДАР ӘЛЕМІ",
       "⚗ ХИМИЯЛЫҚ ЗЕРТХАНА",
       "✦ РЕАКЦИЯЛАР ҒАЛАМЫ"][room],
      W/2,H*.14,Math.min(34,Math.max(17,W*.035)),t.light
    );

    // Нысана
    line(W/2-9,H/2,W/2+9,H/2,"#ffffffaa",2);
    line(W/2,H/2-9,W/2,H/2+9,"#ffffffaa",2);

    // Төменгі безендіру
    ctx.fillStyle=t.light+"99";
    ctx.fillRect(W*.15,H*.955,W*.7,Math.max(2,H*.003));
  };

  console.log("CHEM QUEST 3D: химиялық 3D дизайн қосылды");
})();
</script>

</body>
</html>
